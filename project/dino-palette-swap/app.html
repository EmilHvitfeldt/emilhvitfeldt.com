<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dino Palette Swap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f5f2f7; --panel:#fff; --line:#e7e1ec; --ink:#241f29; --mute:#80788a; --accent:#a63d91; --accent-soft:#f8e9f4; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 14px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover { background:#8f307d; }
  button.ghost { border-color:transparent; background:none; color:var(--mute); padding:3px 8px; font-size:12px; }
  button.ghost:hover { color:var(--accent); background:var(--accent-soft); }
  button.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  header { height:56px; flex:none; display:flex; align-items:center; gap:8px; padding:0 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { margin:0 auto 0 0; font-size:16px; font-weight:700; letter-spacing:-.01em; }
  .app { flex:1; min-height:0; display:grid; grid-template-columns:340px 1fr; }
  aside { overflow:auto; padding:18px 18px 40px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:22px; }
  main { overflow:auto; padding:22px; }
  @media (max-width:860px) { .app { grid-template-columns:1fr; } aside { max-height:50vh; border-right:0; border-bottom:1px solid var(--line); } }

  h2 { margin:0 0 10px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--mute); display:flex; align-items:center; justify-content:space-between; }
  h3 { margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--mute); }


  /* sliders */
  .note { color:var(--mute); font-size:12.5px; }

  /* roles */
  .role { display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:center; padding:5px 6px; margin:0 -6px; border-radius:10px; }
  .role:hover { background:#faf7fc; }
  .role input[type=color] { width:38px; height:38px; padding:0; border:1px solid rgba(0,0,0,.15); border-radius:9px; background:none; cursor:pointer; }
  .role .t { min-width:0; }
  .role .name { font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px; }
  .role .name .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .role .sub { font-size:12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role .hex { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--mute); }
  .role .tag { font-weight:400; font-size:11px; color:var(--accent); background:var(--accent-soft); border-radius:4px; padding:0 6px; }
  .role .swatch { width:38px; height:38px; border-radius:9px; border:1px solid rgba(0,0,0,.15); }

  /* cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
  .card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .art { height:250px; padding:16px; }
  .art img { width:100%; height:100%; object-fit:contain; display:block; }
  .orig { position:absolute; left:10px; top:10px; width:70px; height:70px; border-radius:10px; border:1px solid var(--line); background:#fff; padding:4px; display:none; }
  body.compare .orig { display:block; }
  .orig img { width:100%; height:100%; object-fit:contain; }
  .foot { display:flex; align-items:baseline; gap:8px; padding:9px 8px 9px 14px; border-top:1px solid var(--line); background:#fff; }
  .foot b { font-size:13.5px; }
  .foot small { color:var(--mute); flex:1; }
  .bgs { display:flex; gap:8px; align-items:center; }
  .bgs button { width:28px; height:28px; padding:0; border-radius:50%; border:1px solid rgba(0,0,0,.2); }
  .bgs button.on { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header>
  <h1>Dino Palette Swap</h1>
  <button id="compare">Compare to original</button>
  <button id="dlpng">Download sheet (PNG)</button>
  <button class="primary" id="dlsvg">Download 8 SVGs</button>
</header>

<div class="app">
  <aside>
    <div>
      <h2>Colors <button class="ghost" id="resetedits">Reset to original</button></h2>
      <div id="roles"></div>
      <div class="note" style="margin-top:8px">Hover a color to see where it is used (everything else turns grey).</div>
    </div>
    <div>
      <h2>Preview background</h2>
      <div class="bgs" id="bgs"></div>
    </div>
  </aside>
  <main><div class="grid" id="cards"></div></main>
</div>

const $ = s => document.querySelector(s);
const ORIG = Object.fromEntries(ROLES.map(r => [r.id, r.def]));

// ---------- color math ----------
const rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16)/255);
function toHsl(h) {
  const [r,g,b] = rgb(h), mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx-mn;
  let hh = 0, s = 0;
  if (d) { s = d/(1-Math.abs(2*l-1)); hh = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; hh *= 60; if (hh<0) hh += 360; }
  return [hh,s,l];
}
function fromHsl(h,s,l) {
  h = ((h%360)+360)%360; s = Math.min(1,Math.max(0,s)); l = Math.min(1,Math.max(0,l));
  const c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2;
  const [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#' + [r,g,b].map(v => Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}

// ---------- derived colors ----------
// A derived role follows another: it keeps the same hue/saturation/lightness offset it has from its parent in the original pink.
const DERIVED = { shade: 'body', line: 'body', accentLight: 'accent' };   // line is the thin smile line; it is hidden but tracks the body color
const offset = {};
for (const [id, parent] of Object.entries(DERIVED)) {
  const a = toHsl(ORIG[id]), b = toHsl(ORIG[parent]);
  offset[id] = [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
}
const derivedFrom = (id, parentHex) => { const [h,s,l] = toHsl(parentHex), o = offset[id]; return fromHsl(h+o[0], s+o[1], l+o[2]); };
function derive(colors) {
  for (const [id, parent] of Object.entries(DERIVED)) colors[id] = derivedFrom(id, colors[parent]);
  return colors;
}

// ---------- state ----------
let edits = {};                    // role -> hex set by hand (everything else is the original pink)
let locate = null;                 // role being hovered
let cardBg = '#ffffff';

function palette() {
  return derive({ ...ORIG, ...edits });
}
const fill = (tpl, colors) => tpl.replace(/\{\{(\w+)\}\}/g, (_, id) => colors[id]);
function svgFor(d, colors) { return fill(d.svg, colors); }
function locateColors() {
  const out = {}; ROLES.forEach(r => out[r.id] = r.id === locate ? '#00d26a' : '#d4d0d9'); return out;
}
const isHidden = r => r.group === 'Face' || r.hidden;   // hidden roles keep their original color
const usage = Object.fromEntries(ROLES.map(r => [r.id, DINOS.filter(d => d.svg.includes(`{{${r.id}}}`)).map(d => d.name)]));

// ---------- render ----------
function renderRoles() {
  const box = $('#roles'), pal = palette(); box.innerHTML = '';
  ROLES.forEach(r => {
    if (isHidden(r)) return;   // face colors and claws are not editable: always the original
    const el = document.createElement('div'); el.className = 'role'; el.dataset.role = r.id;
    const n = usage[r.id].length;
    const sub = `<div class="sub" title="${usage[r.id].join(', ')}">${r.hint} · ${n===DINOS.length?'all 8':n===1?usage[r.id][0]:n+' dinos'}</div>`;
    if (DERIVED[r.id]) {
      // follows another color: shown as a swatch instead of a picker
      el.innerHTML = `<div class="swatch" style="background:${pal[r.id]}"></div>
        <div class="t"><div class="name">${r.label}<span class="tag">follows ${DERIVED[r.id]}</span></div>${sub}
        <div class="hex">${pal[r.id]}${ORIG[r.id] !== pal[r.id] ? ` <span style="opacity:.6">was ${ORIG[r.id]}</span>` : ''}</div></div>`;
    } else {
      el.innerHTML = `<input type="color" value="${pal[r.id]}">
        <div class="t"><div class="name">${r.label}${edits[r.id] ? '<span class="dot" title="edited by hand"></span>' : ''}</div>${sub}
        <div class="hex">${pal[r.id]}${ORIG[r.id] !== pal[r.id] ? ` <span style="opacity:.6">was ${ORIG[r.id]}</span>` : ''}</div></div>`;
      const pick = el.querySelector('input');
      pick.oninput = () => { edits[r.id] = pick.value; el.querySelector('.hex').textContent = pick.value; renderCards(); syncDerivedRows(); };
      pick.onchange = renderRoles;
    }
    el.onmouseenter = () => { locate = r.id; renderCards(); };
    el.onmouseleave = () => { locate = null; renderCards(); };
    box.appendChild(el);
  });
}
// Keeps derived rows (e.g. Shade) in step with their parent while a picker or slider is being dragged, without rebuilding the list.
function syncDerivedRows() {
  const pal = palette();
  for (const id of Object.keys(DERIVED)) {
    const row = document.querySelector(`.role[data-role="${id}"]`); if (!row) continue;
    row.querySelector('.swatch').style.background = pal[id];
    row.querySelector('.hex').innerHTML = `${pal[id]}${ORIG[id] !== pal[id] ? ` <span style="opacity:.6">was ${ORIG[id]}</span>` : ''}`;
  }
}

function renderCards() {
  const wrap = $('#cards'), pal = palette(), show = locate ? locateColors() : pal;
  if (!wrap.children.length) {
    DINOS.forEach(d => {
      const el = document.createElement('div'); el.className = 'card'; el.dataset.file = d.file;
      el.innerHTML = `<div class="art"><img alt="${d.name}"></div><div class="orig"><img alt="original"></div>
        <div class="foot"><b>${d.name}</b><small>${d.file}</small><button class="ghost">Save SVG</button></div>`;
      el.querySelector('.orig img').src = blobUrl(fill(d.svg, ORIG));
      el.querySelector('button').onclick = () => download(`${fname()}-${d.file}.svg`, svgFor(d, palette()));
      wrap.appendChild(el);
    });
  }
  wrap.querySelectorAll('.card').forEach((el, i) => {
    el.querySelector('.art').style.background = cardBg;
    el.querySelector('.art img').src = blobUrl(svgFor(DINOS[i], show));
  });
}
// data: URLs rather than blob: URLs, so previews also work in viewers that block blobs
const blobUrl = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
function renderAll() { renderRoles(); renderCards(); }

// ---------- downloads ----------
const fname = () => 'palette';   // prefix for downloaded files, so they never overwrite the originals
function download(name, content, type='image/svg+xml') {
  const a = document.createElement('a');
  a.href = content instanceof Blob ? URL.createObjectURL(content) : URL.createObjectURL(new Blob([content], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
$('#dlsvg').onclick = () => { const pal = palette(); DINOS.forEach((d,i) => setTimeout(() => download(`${fname()}-${d.file}.svg`, svgFor(d, pal)), i*250)); };
$('#dlpng').onclick = async () => {
  const pal = palette(), cols = 4, cell = 480, rows = Math.ceil(DINOS.length/cols);
  const cv = document.createElement('canvas'); cv.width = cols*cell; cv.height = rows*cell;
  const cx = cv.getContext('2d'); cx.fillStyle = cardBg; cx.fillRect(0,0,cv.width,cv.height);
  await Promise.all(DINOS.map((d,i) => new Promise(res => {
    const vb = d.svg.match(/viewBox="[\d.\s-]*?([\d.]+)\s+([\d.]+)"/), w = +vb[1], h = +vb[2], k = Math.min((cell-60)/w, (cell-60)/h);
    const img = new Image(); img.width = w*k; img.height = h*k;
    img.onload = () => { cx.drawImage(img, (i%cols)*cell+(cell-w*k)/2, Math.floor(i/cols)*cell+(cell-h*k)/2, w*k, h*k); res(); };
    img.src = blobUrl(svgFor(d, pal).replace('<svg ', `<svg width="${w*k}" height="${h*k}" `));
  })));
  cv.toBlob(b => download(`${fname()}-sheet.png`, b));
};

// ---------- controls ----------
$('#resetedits').onclick = () => { edits = {}; renderRoles(); renderCards(); };
$('#compare').onclick = e => { document.body.classList.toggle('compare'); e.target.classList.toggle('on'); };
['#ffffff','#f3ecf7','#cfe8ef','#2a2630'].forEach((c,i) => {
  const b = document.createElement('button'); b.style.background = c; b.title = c; if (!i) b.className = 'on';
  b.onclick = () => { cardBg = c; document.querySelectorAll('#bgs button').forEach(x => x.classList.toggle('on', x === b)); renderCards(); };
  $('#bgs').appendChild(b);
});
renderAll();
</script>
